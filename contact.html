<link rel="stylesheet" href="styles.css">
<style>
  .page-head{
    padding: 150px clamp(20px, 5vw, 56px) 30px;
    max-width: 1180px;
    margin: 0 auto;
  }
  .page-eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.12em;
    margin-bottom: 14px;
  }
  .page-eyebrow::before{ content:""; color: var(--text-faint); }
  .page-title{
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(32px, 6vw, 60px);
    margin: 0;
  }
    /* ---------- BOARD ---------- */
  .board-wrap{
    max-width: 1020px;
    margin: 80px auto 100px;
    padding: 0 clamp(16px, 4vw, 40px);
  }
  .board{
    position:relative;
    width:100%;
    aspect-ratio:1000/760;
    border-radius:20px;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,.06), transparent 45%),
      repeating-linear-gradient(115deg, #b98a55 0px, #a1713f 3px, #b98a55 6px),
      linear-gradient(160deg, #b98a55, #a1713f);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.35),
      0 20px 50px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .board::before{
    /* subtle grain */
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(rgba(0,0,0,.10) 1px, transparent 1px);
    background-size:3px 3px;
    opacity:.5;
    pointer-events:none;
  }
  .board svg.threads{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  .thread-line{
    stroke:#8f2018;
    stroke-width:2.6;
    filter:drop-shadow(0 2px 1px rgba(0,0,0,.35));
  }

  .pin{
    position:absolute;
    width:16px; height:16px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #3a3a3a, #0a0a0a 70%);
    box-shadow:0 3px 4px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
    transform:translate(-50%,-50%);
    z-index:5;
  }

  .center-pin{ left:50%; top:44%; }

  .sticky-note{
    position:absolute;
    left:37%; top:47%;
    width:230px;
    background:#f1e3a6;
    color:#1c1a12;
    padding:20px 18px 16px;
    font-family:'Special Elite', monospace;
    font-size:22px;
    line-height:1.25;
    box-shadow:0 10px 18px rgba(0,0,0,.35);
    transform:translate(-18%,0) rotate(-2.5deg);
    z-index:3;
  }
  .sticky-note .sub{
    display:block;
    margin-top:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    opacity:.6;
  }

  /* ---------- EVIDENCE CARDS ---------- */
  .card{
    position:absolute;
    width:230px;
    text-decoration:none;
    color:#171512;
    background:#eceae2;
    padding:14px 14px 12px;
    box-shadow:0 12px 22px rgba(0,0,0,.4);
    z-index:4;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{
    box-shadow:0 16px 28px rgba(0,0,0,.5);
    z-index:8;
  }
  .card .pin{ top:-8px; left:50%; }

  .card .photo{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:
      linear-gradient(180deg, #dedad0, #cfcabd);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card .photo svg{
    width:62%;
    height:62%;
    stroke:#232019;
    fill:none;
    stroke-width:2.2;
  }
  .card .photo::after{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0, rgba(0,0,0,.05) 1px, transparent 1px, transparent 26px);
    mix-blend-mode:multiply;
  }

  .stamp{
    position:absolute;
    top:38%;
    left:-6%;
    width:112%;
    text-align:center;
    font-family:'Special Elite', monospace;
    font-size:13px;
    letter-spacing:.06em;
    color:#8f2018;
    border-top:2px solid #6e150f;
    border-bottom:2px solid #6e150f;
    padding:5px 4px;
    background:rgba(255,255,255,.08);
    transform:rotate(-7deg);
    mix-blend-mode:multiply;
    word-break:break-word;
    pointer-events:none;
  }

  .card .label{
    margin-top:12px;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    opacity:.65;
    display:flex;
    justify-content:space-between;
  }

  /* positions + slight rotations, tuned to feel scattered like the corkboard reference */
  .card-email{
    left:5%; top:6%;
    transform:rotate(-4deg);
  }
  .card-github{
    left:62%; top:4%;
    transform:rotate(3.5deg);
  }
  .card-linkedin{
    left:60%; top:56%;
    transform:rotate(-3deg);
  }
  .card-email:hover{ transform:rotate(-4deg) scale(1.03); }
  .card-github:hover{ transform:rotate(3.5deg) scale(1.03); }
  .card-linkedin:hover{ transform:rotate(-3deg) scale(1.03); }

  footer{
    text-align:center;
    font-size:11px;
    letter-spacing:.1em;
    opacity:.4;
    padding:24px 0 40px;
  }

  /* ---------- MOBILE: fall back to a clean stacked list ---------- */
  @media (max-width: 720px){
    .board{
      aspect-ratio:auto;
      padding:26px 16px 34px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:26px;
    }
    .board svg.threads{ display:none; }
    .center-pin{ display:none; }
    .sticky-note{
      position:static;
      transform:rotate(-1.5deg);
      order:-1;
      width:auto;
      align-self:flex-start;
    }
    .card{
      position:static;
      width:100%;
      max-width:280px;
      transform:none !important;
    }
    .card:hover{ transform:none !important; }
  }
</style>
</style>
</head>
